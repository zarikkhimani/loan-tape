version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Update these pins with .uv-version as a deliberate tooling change.
    ignore:
      - dependency-name: uv
      - dependency-name: uv-build
      - dependency-name: uv_build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
