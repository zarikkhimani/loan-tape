name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach client files, borrower information, credentials, original file
        paths, or private portfolio data. Report suspected vulnerabilities privately
        using SECURITY.md, not this issue form.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal synthetic example and the command used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version and operating system
      description: Include Python version and Excel version if the issue involves desktop Excel.
    validations:
      required: true
